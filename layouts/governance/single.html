{{ define "main" }}
  <article>
    <h1>{{ .Title }}</h1>
    {{ if or .Params.adopted .Params.last_amended }}
      <dl class="meta">
        {{ with .Params.adopted }}
          <dt>Adopted</dt>
          <dd>{{ (time .).Format "January 2, 2006" }}</dd>
        {{ end }}
        {{ with .Params.last_amended }}
          <dt>Last amended</dt>
          <dd>{{ (time .).Format "January 2, 2006" }}</dd>
        {{ end }}
      </dl>
    {{ end }}
    {{ .Content }}
  </article>
{{ end }}
