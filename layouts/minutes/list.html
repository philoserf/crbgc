{{ define "main" }}
  <article>
    <h1>{{ .Title }}</h1>
    {{ .Content }}
    {{ range (.Pages.GroupByDate "2006").Reverse }}
      <h2>{{ .Key }}</h2>
      <ul class="item-list">
        {{ range .Pages.ByDate.Reverse }}
          {{ partial "item-row.html" (dict "page" . "badge" true) }}
        {{ end }}
      </ul>
    {{ end }}
  </article>
{{ end }}
