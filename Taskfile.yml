version: "3"

tasks:
  setup:
    desc: Install the toolchain (Brewfile) and JS dependencies
    cmds:
      - brew bundle --file=Brewfile
      - bun install

  prettier:
    desc: Format markdown, HTML/Hugo, YAML, TOML, and JSON with Prettier
    cmds:
      # Run twice: prettier-plugin-go-template is non-idempotent and can need a
      # second pass to converge. Upstream is abandoned (no commit since 2023-07-26,
      # no 1.0 coming), so the version is pinned exact and this pass is permanent.
      # Prettier 4 breaks the plugin outright — see issue #52.
      - bunx prettier --write '**/*.{md,html,yml,yaml,toml,json}'
      - bunx prettier --write '**/*.{md,html,yml,yaml,toml,json}'

  biome:
    desc: Format and lint CSS with Biome
    cmds:
      - bunx biome check --write assets

  format:
    desc: Format and fix all files
    cmds:
      - task: prettier
      - task: biome

  check:
    desc: Check all files without changing them
    cmds:
      # Inlined rather than delegated: `.github/workflows/pages.yml` runs these
      # same two strings directly, so that CI need not install go-task for two
      # lines. Keeping them here verbatim is what makes the two agree (#84).
      - bunx prettier --check '**/*.{md,html,yml,yaml,toml,json}'
      - bunx biome check assets

  serve:
    desc: Run Hugo dev server with drafts and future-dated content
    cmds:
      - hugo server -D --buildFuture

  build:
    desc: Build the site to ./public
    cmds:
      # --panicOnWarning: Hugo warnings are advisory by default, so a template
      # lookup failure publishes a broken section and exits 0. CI uses the same
      # flag (#87).
      - hugo --minify --gc --panicOnWarning
