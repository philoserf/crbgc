version: "3"

tasks:
  setup:
    desc: Install the toolchain (Brewfile) and JS dependencies
    cmds:
      - brew bundle --file=Brewfile
      - bun install

  prettier:
    desc: Format markdown, HTML/Hugo, YAML, TOML, and JSON with Prettier
    cmds:
      # Run twice: prettier-plugin-go-template is non-idempotent and can need a
      # second pass to converge. Upstream is abandoned (no commit since 2023-07-26,
      # no 1.0 coming), so the version is pinned exact and this pass is permanent.
      # Prettier 4 breaks the plugin outright — see issue #52.
      - bunx prettier --write '**/*.{md,html,yml,yaml,toml,json}'
      - bunx prettier --write '**/*.{md,html,yml,yaml,toml,json}'

  biome:
    desc: Format and lint CSS with Biome
    cmds:
      - bunx biome check --write assets

  format:
    desc: Format and fix all files
    cmds:
      - task: prettier
      - task: biome

  check:
    desc: Check all files without changing them
    cmds:
      # Inlined rather than delegated: `.github/workflows/pages.yml` runs these
      # same two strings directly, so that CI need not install go-task for two
      # lines. Keeping them here verbatim is what makes the two agree (#84).
      - bunx prettier --check '**/*.{md,html,yml,yaml,toml,json}'
      - bunx biome check assets

  icons:
    desc: Regenerate the favicon rasters and the Open Graph card (macOS only)
    cmds:
      # Two files are sources and are NOT generated here: static/favicon.svg and
      # static/seal.svg. Both carry traced outlines rather than <text> — the same
      # New York ampersand in each, plus Copperplate ring text in the seal — so the
      # marks render identically everywhere instead of following the reader's own
      # fonts the way body text does. Retracing needs a WebKit render plus potrace;
      # everything below is reproducible from those two files.
      - magick -background white -density 1152 static/favicon.svg -resize 1024x1024 /tmp/crbgc-icon.png
      # -strip and the excluded chunks keep the output byte-identical run to run:
      # without them ImageMagick stamps a tIME chunk and every run dirties the tree.
      - magick /tmp/crbgc-icon.png -resize 180x180 -background white -alpha remove -alpha off -colors 64 -strip -define png:exclude-chunks=date,time PNG8:static/apple-touch-icon.png
      - magick /tmp/crbgc-icon.png -resize 16x16 -background white -alpha remove -alpha off /tmp/crbgc-16.png
      - magick /tmp/crbgc-icon.png -resize 32x32 -background white -alpha remove -alpha off /tmp/crbgc-32.png
      - magick /tmp/crbgc-icon.png -resize 48x48 -background white -alpha remove -alpha off /tmp/crbgc-48.png
      - magick /tmp/crbgc-16.png /tmp/crbgc-32.png /tmp/crbgc-48.png -colors 64 static/favicon.ico
      # The card is the seal over the club name. The seal is rasterised in its own
      # command because -density leaks past the parentheses and would scale
      # -pointsize with it, blowing the type up by 16x. Fonts are given by full
      # path: ImageMagick resolves no font by name on this machine.
      - magick -background white -density 1152 static/seal.svg -resize 250x250 /tmp/crbgc-seal.png
      - magick -size 1200x630 xc:white /tmp/crbgc-seal.png -gravity north -geometry +0+78 -composite -font /System/Library/Fonts/NewYork.ttf -fill '#09090b' -pointsize 58 -gravity north -annotate +0+368 'The Common & Recent Bogeymens Golf Club' -fill '#e4e4e5' -draw 'rectangle 520,478 680,479' -font /System/Library/Fonts/SFNS.ttf -fill '#6b6b6f' -pointsize 28 -kerning 3 -gravity north -annotate +0+512 'crbgc.org' -depth 8 -strip static/og-image.png

  serve:
    desc: Run Hugo dev server with drafts and future-dated content
    cmds:
      - hugo server -D --buildFuture

  build:
    desc: Build the site to ./public
    cmds:
      # --panicOnWarning: Hugo warnings are advisory by default, so a template
      # lookup failure publishes a broken section and exits 0. CI uses the same
      # flag (#87).
      - hugo --minify --gc --panicOnWarning
