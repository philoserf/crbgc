name: Pages

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily at 06:07 UTC — 02:07 EDT in summer, 01:07 EST in winter (UTC has
    # no DST). Either way it's after local midnight, so future-dated content
    # rolls in same-day. Offset from the hour to avoid the cron surge.
    - cron: "7 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  HUGO_VERSION: latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      # README names `task check` as the thing to run before opening a PR, and
      # until now nothing ran it — which made Biome advisory. It is not
      # redundant with Prettier: Prettier's CSS output is byte-identical to
      # Biome's here, but Biome also lints, and on a hand-written stylesheet
      # using relative oklch() that lint is the point (#87).
      # The two commands are the two `task check` runs, verbatim, rather than
      # installing go-task in CI for two lines. First step in the job: failing
      # on whitespace should not cost a Hugo build.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Check formatting and lint
        run: |
          bun install --frozen-lockfile
          bunx prettier --check '**/*.{md,html,yml,yaml,toml,json}'
          bunx biome check assets

      # Runs on pull requests too, and before the real build, so a content
      # invariant break fails the PR rather than the unattended cron deploy.
      # Both flags are load-bearing: validate-content.html iterates
      # .RegularPages, which excludes future-dated posts (--buildFuture) and
      # drafts (-D) from a default build, so without them a post written ahead
      # of time is unchecked until the day it publishes.
      # --panicOnWarning on both: Hugo warnings are advisory by default, so a
      # template lookup failure publishes a broken section and still exits 0.
      # It is on Validate too because that step is the one that sees drafts and
      # future-dated posts, where a warning should fail the PR rather than the
      # day the post publishes.
      - name: Validate content
        run: hugo --buildFuture -D --renderToMemory --gc --panicOnWarning

      - name: Build
        run: hugo --minify --gc --panicOnWarning

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Scoped to the deploy job, so a pull request's build never queues behind
    # a deploy. Never cancel: an interrupted Pages deploy can leave the site
    # half-published.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
